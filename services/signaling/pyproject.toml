[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signaling"
version = "0.1.0"
description = "WebSocket & REST API service"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "redis[hiredis]",
    "pydantic>=2",
    "python-jose[cryptography]",
    "PyJWT",
    "slowapi",
    "structlog",
    "pipeline-shared",
]

[tool.setuptools.packages.find]
where = ["src"]
