[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alerting"
version = "0.1.0"
description = "Telegram, Slack and MQTT alert dispatch service"
requires-python = ">=3.11"
dependencies = [
    "aiogram",
    "aiohttp",
    "asyncio-mqtt",
    "redis[hiredis]",
    "structlog",
    "pipeline-shared",
]

[tool.setuptools.packages.find]
where = ["src"]
