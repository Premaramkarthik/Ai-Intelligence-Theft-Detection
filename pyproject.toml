[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pipeline-opencv"
version = "0.2.0"
description = "Real-time video inference pipeline"
requires-python = ">=3.11"
dependencies = [
    # Dependencies are managed via requirements.txt for simplicity across Docker/Local
    # but we can list the core ones here if we want 'pip install .' to work partially.
    # For now, we'll keep it as the user requested: one requirements.txt.
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["libs*", "services*"]

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]   # line-length handled by formatter; FastAPI Depends() pattern

[tool.ruff.lint.isort]
known-first-party = ["backend"]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true   # TensorRT / OpenVINO stubs not available
exclude = ["tests/", "model_quantization/"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_cli = true
log_level = "DEBUG"
