services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
      - "9997:9997"
      - "9998:9998"
    environment:
      MTX_AUTHMETHOD: internal
      MTX_API: "yes"
      MTX_APIADDRESS: :9997
      MTX_METRICS: "yes"
      MTX_METRICSADDRESS: :9998
      MTX_AUTHINTERNALUSERS_0_USER: any
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_ACTION: publish
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_1_ACTION: read
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_2_ACTION: playback
      MTX_AUTHINTERNALUSERS_1_USER: any
      MTX_AUTHINTERNALUSERS_1_IPS: 127.0.0.1,::1
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_ACTION: api
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_1_ACTION: metrics
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_2_ACTION: pprof
      MTX_AUTHINTERNALUSERS_2_USER: ${MEDIAMTX_API_USERNAME:-backend-control}
      MTX_AUTHINTERNALUSERS_2_PASS: ${MEDIAMTX_API_PASSWORD:-backend-control-dev-secret}
      MTX_AUTHINTERNALUSERS_2_PERMISSIONS_0_ACTION: api
      MTX_AUTHINTERNALUSERS_2_PERMISSIONS_1_ACTION: metrics
      MTX_AUTHINTERNALUSERS_2_PERMISSIONS_2_ACTION: pprof
    volumes:
      - ./runtime/mediamtx.generated.yml:/mediamtx.yml
    networks:
      - backend_net

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
      - --auto-compaction-mode=revision
      - --auto-compaction-retention=1000
      - --quota-backend-bytes=4294967296
      - --snapshot-count=50000
    volumes:
      - ./runtime/milvus/etcd:/etcd
    networks:
      - backend_net

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: minio server /minio_data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - ./runtime/milvus/minio:/minio_data
    networks:
      - backend_net

  milvus:
    image: milvusdb/milvus:v2.6.11
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_REGION: us-east-1
    volumes:
      - ./runtime/milvus/data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - etcd
      - minio
    networks:
      - backend_net

  triton:
    image: nvcr.io/nvidia/tritonserver:24.08-py3
    command: ["tritonserver", "--model-repository=/models/triton", "--log-verbose=1", "--allow-grpc=true", "--allow-http=true", "--metrics-port=8002"]
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    shm_size: '1gb'
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - ./model_repository:/models
    networks:
      - backend_net

  kafka:
    build:
      context: ./observability/kafka_jmx
      dockerfile: Dockerfile
    image: pipeline-opencv-kafka-jmx:8.1.1
    hostname: kafka
    ports:
      - "9092:9092"
      - "7071:7071"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT_INTERNAL"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT"
      KAFKA_LISTENERS: "CONTROLLER://kafka:29093,PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_EXTERNAL://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_EXTERNAL://localhost:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_OPTS: "-javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent-1.5.0.jar=7071:/etc/jmx-exporter/kafka.yml"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - ./observability/kafka_jmx/kafka.yml:/etc/jmx-exporter/kafka.yml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "unset KAFKA_OPTS && kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - backend_net

  kafka-init:
    image: confluentinc/cp-kafka:8.1.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic camera.status --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic camera.events --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic camera.ai_results --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic camera.tracking.updates --partitions 1 --replication-factor 1
    restart: "no"
    networks:
      - backend_net

  node-exporter:
    image: prom/node-exporter:latest
    network_mode: host
    pid: host
    command:
      - "--path.rootfs=/host"
      - "--path.udev.data=/host/run/udev/data"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|host|etc)($|/)"
      - "--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$"
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped


  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    network_mode: host
    command:
      - "--config.file=/etc/postgres_exporter/postgres_exporter.yml"
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DATA_SOURCE_NAME:-postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable}
    volumes:
      - ./observability/postgres_exporter/postgres_exporter.yml:/etc/postgres_exporter/postgres_exporter.yml:ro
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    network_mode: host
    command:
      - "-config.file=/etc/loki/config.yaml"
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - ./runtime/loki:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    network_mode: host
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    network_mode: host
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        sed -e "s|__PROMETHEUS_SCRAPE_TARGET__|127.0.0.1:9109|g" \
          -e "s|__MEDIAMTX_METRICS_USERNAME__|${MEDIAMTX_API_USERNAME:-backend-control}|g" \
          -e "s|__MEDIAMTX_METRICS_PASSWORD__|${MEDIAMTX_API_PASSWORD:-backend-control-dev-secret}|g" \
          /etc/prometheus/prometheus.yml.tmpl > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml.tmpl:/etc/prometheus/prometheus.yml.tmpl:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - kafka
      - node-exporter
      - postgres-exporter
      - loki
      - alloy

  grafana:
    image: grafana/grafana:latest
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_HTTP_PORT: 3001
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

networks:
  backend_net:
