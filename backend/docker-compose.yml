# ── Load Balancer (OPTIONAL) ──────────────────────────────────────────────────
# NOT required for a single-store deployment.
# Redis Consumer Groups already load-balance inference across N workers (see
# the `inference` service below — just scale it: `docker compose up --scale inference=3`).
#
# Enable this block ONLY if you:
#   - Deploy across multiple stores hitting the same Signaling API, OR
#   - Want TLS termination + reverse proxy in front of the admin UI / frontend
#
# nginx:
#   image: nginx:1.27-alpine
#   ports: ["80:80", "443:443"]
#   volumes:
#     - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
#     - ./docker/certs:/etc/nginx/certs:ro   # mount your TLS certs here
#   depends_on: [signaling]
#   restart: unless-stopped
#
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Infrastructure ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports: [ "6379:6379" ]
    volumes: [ redis-data:/data ]
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: [ "5432:5432" ]
    volumes: [ pg-data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s

  mqtt:
    image: eclipse-mosquitto:2
    ports: [ "1883:1883" ]
    volumes: [ ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf ]

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-premaramkarthik99@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports: [ "5050:80" ]
    volumes: [ pgadmin-data:/var/lib/pgadmin ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Backend Services ─────────────────────────────────────
  signaling:
    build:
      context: . # root so COPY packages/shared works
      dockerfile: docker/Dockerfile.signaling
    env_file: .env
    ports: [ "9000:9000", "9100:9100" ]
    depends_on: [ redis ]
    restart: unless-stopped

  mediabridge:
    build:
      context: . # root so COPY packages/shared works
      dockerfile: docker/Dockerfile.mediabridge
    env_file: .env
    ports: [ "9102:9102" ]
    ipc: host # shares /dev/shm with inference
    depends_on: [ redis ]
    restart: unless-stopped

  inference:
    build:
      context: . # root so COPY packages/shared works
      dockerfile: docker/Dockerfile.inference
    env_file: .env
    ipc: host # reads shared memory written by mediabridge
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    volumes:
      - ./models:/app/models:ro
    ports: [ "9101:9101" ]
    depends_on: [ redis ]
    restart: unless-stopped

  alerting:
    build:
      context: . # root so COPY packages/shared works
      dockerfile: docker/Dockerfile.alerting
    env_file: .env
    ports: [ "9103:9103" ]
    depends_on: [ redis ]
    restart: unless-stopped

  persistence:
    build:
      context: . # root so COPY packages/shared works
      dockerfile: docker/Dockerfile.persistence
    env_file: .env
    volumes:
      - evidence-data:/data/evidence
    ports: [ "9104:9104" ]
    depends_on: [ redis, postgres ]
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
  pgadmin-data:
  evidence-data:
