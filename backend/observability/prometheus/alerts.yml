groups:
  - name: pipeline_backend.rules
    rules:
      - alert: BackendMetricsUnavailable
        expr: up{job="backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Backend metrics endpoint is unavailable.
          description: Prometheus has been unable to scrape the FastAPI metrics endpoint for at least one minute.

      - alert: TritonMetricsUnavailable
        expr: up{job="triton"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Triton metrics endpoint is unavailable.
          description: Prometheus has been unable to scrape the Triton metrics endpoint for at least two minutes.

      - alert: PipelineFrameDropRateHigh
        expr: sum by (camera_id) (rate(frames_dropped_total[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Frame drop rate is elevated.
          description: Camera {{ $labels.camera_id }} is dropping more than two frames per second over the last five minutes.

      - alert: PipelineProcessingLatencyHigh
        expr: histogram_quantile(0.95, sum by (camera_id, le) (rate(frame_processing_latency_ms_bucket[5m]))) > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Frame processing latency is elevated.
          description: Camera {{ $labels.camera_id }} has p95 frame processing latency above 500 ms for ten minutes.

      - alert: InferenceQueueBacklogHigh
        expr: max by (camera_id) (inference_queue_depth) > 25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Inference queue backlog is elevated.
          description: Camera {{ $labels.camera_id }} has an inference queue depth above 25 for ten minutes.

      - alert: BackendProcessMemoryHigh
        expr: process_memory_usage_bytes > 2147483648
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Backend memory usage is elevated.
          description: Backend RSS memory has remained above 2 GiB for ten minutes.
