global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    stack: pipeline_opencv

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: backend
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9109
        labels:
          service: backend

  - job_name: triton
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets:
          - triton:8002
        labels:
          service: triton

  - job_name: kafka_jmx
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - kafka:7071
        labels:
          service: kafka
