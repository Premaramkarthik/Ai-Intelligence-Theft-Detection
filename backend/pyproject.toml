[project]
name = "rtsp-camera-backend"
version = "1.0.0"
description = "Frontend-friendly RTSP camera backend with FastAPI, asyncpg, Kafka, and worker-based ingestion."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiokafka>=0.11.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.12",
    "pre-commit>=4.5.1",
    "pydantic-settings>=2.8.1",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pylint>=3.3.6",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.11.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]
ignore = ["N818"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pylint.main]
fail-under = 10
ignore-paths = ["^tests/fixtures/.*$"]
persistent = false

[tool.pylint.messages_control]
disable = [
    "duplicate-code",
    "import-outside-toplevel",
    "invalid-name",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "redefined-outer-name",
    "too-many-arguments",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-positional-arguments",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 10
