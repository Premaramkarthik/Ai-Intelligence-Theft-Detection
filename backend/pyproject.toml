[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-opencv"
version = "0.2.0"
description = "Real-time video inference pipeline"
requires-python = ">=3.11"
dependencies = [
    # ── API & Web ──────────────────────────────────────────────────────────────
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "python-multipart",
    "slowapi",
    "aiohttp",
    "aiortc",
    # ── Data & Config ──────────────────────────────────────────────────────────
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "pyyaml",
    # ── Auth ───────────────────────────────────────────────────────────────────
    "PyJWT",
    "python-jose[cryptography]",
    # ── Database & Messaging ───────────────────────────────────────────────────
    "asyncpg",
    "redis[hiredis]",
    "asyncio-mqtt",
    "aiofiles",
    # ── ML & Computer Vision ───────────────────────────────────────────────────
    "torch",
    "torchvision",
    "pytorch-lightning",
    "ultralytics",
    "timm",
    "transformers",
    "numpy",
    "opencv-python-headless",
    "av",
    # ── Messaging & Alerts ─────────────────────────────────────────────────────
    "python-telegram-bot",
    # ── Observability ──────────────────────────────────────────────────────────
    "structlog",
    "prometheus-client",
    "psutil",
    "tenacity",
    # ── Dashboard ─────────────────────────────────────────────────────────────
    "streamlit",
    "git-filter-repo>=2.47.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "shared*", "apps*"]

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]   # line-length handled by formatter; FastAPI Depends() pattern

[tool.ruff.lint.isort]
known-first-party = ["backend"]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true   # TensorRT / OpenVINO stubs not available
exclude = ["tests/", "model_quantization/"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_cli = true
log_level = "DEBUG"
