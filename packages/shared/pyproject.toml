[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-shared"
version = "0.1.0"
description = "Shared internal library for pipeline_opencv services"
requires-python = ">=3.11"
dependencies = [
    "structlog",
    "pydantic>=2",
    "redis[hiredis]",
    "asyncpg",
]

[tool.setuptools.packages.find]
where = ["src"]
